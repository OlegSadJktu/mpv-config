# Мягкий переход между файлами плейлиста (scripts/playlist-gap.lua)

# Включён ли скрипт
enabled=yes

# countdown — пауза с обратным отсчётом, дальше сам включит следующий
# ask       — стоять на последнем кадре, пока не нажмёшь Enter
mode=countdown

# Длительность паузы в секундах (для mode=countdown)
delay=6

# Скрипт сам включает keep-open там, где в плейлисте есть следующий файл.
# Поставь no, если хочешь управлять keep-open вручную в mpv.conf.
manage_keep_open=yes

# Внешний вид
font_size=30
bar=yes
bar_width=420
